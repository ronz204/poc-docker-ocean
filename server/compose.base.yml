services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - ocean-net
    volumes:
      - ocean-data:/var/lib/postgresql/data
    healthcheck: # Use pg_isready to check if the database is ready
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
