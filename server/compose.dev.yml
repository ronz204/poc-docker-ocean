services:
  elysia:
    build:
      target: development
    extends:
      service: elysia
      file: compose.base.yml
    container_name: elysia-dev
    develop:
      watch:
        # Sync source code changes
        - action: sync
          path: ./source
          target: /usr/src/app/source
        
        # Sync package.json for hot reload detection
        - action: sync
          path: ./package.json
          target: /usr/src/app/package.json
        
        # Rebuild when dependencies change
        - action: rebuild
          path: ./bun.lock
